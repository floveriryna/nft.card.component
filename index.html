<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | NFT preview card component</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">


</head>
<body>
  <div class="container">
    <div class="content_container">
      <div class="image_container">
        <img src="images/image-equilibrium.jpg" alt="image-equilibrium" class="equilibrium">

        <div class="overlay">
          <img src="images/icon-view.svg" alt="icon_view" class="view_icon">
        </div>
      </div>

      <div class="text">
        <p class="number">Equilibrium #3429</p>
        <p class="description">Our Equilibrium collection promotes balance and calm.</p>

        <div class="price_and_creator_container">
            <div class="price_container">
              <div class="ethereum_container"> 
                <img src="images/icon-ethereum.svg" alt="icon-ethereum" class="icon-ethereum">
                <p class="price">0.041 ETH</p>
              </div>

              <div class="clock_container">
                <img src="images/icon-clock.svg" alt="icon-clock" class="icon-clock">
                <p class="time">3 days left</p>
              </div>
            </div>

          <div class="line"></div>

          <div class="creator_container">
            <img src="images/image-avatar.png" alt="image-avatar" class="avatar">
            <p class="creator">Creation of <span>Jules Wyvern</span></p>
          </div>
        </div>
      </div>
    
    
    </div>
  </div>

  

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Iryna Dubych</a>.
  </div>
</body>
</html>
